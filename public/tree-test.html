<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#9fb0b5;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb0b5);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(15, 8, 17); camera.lookAt(0, 6, 0);
scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x5c5647, 1.2));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2); sun.position.set(10, 20, 8); scene.add(sun);
scene.add(new THREE.GridHelper(40, 20));
new GLTFLoader().load('/assets/models/_testtree/tree_test.glb', (gltf) => {
  const root = gltf.scene;
  root.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    console.log('mat', m.name, 'alpha', m.alphaTest, m.transparent, 'map', m.map?.image?.width);
    m.side = THREE.DoubleSide;
    if (/leaves/i.test(m.name)) { m.alphaTest = 0.5; m.transparent = false; }
    o.castShadow = o.receiveShadow = true;
  });
  const bb = new THREE.Box3().setFromObject(root);
  const size = bb.getSize(new THREE.Vector3());
  console.log('BB', bb.min.toArray(), bb.max.toArray(), size.toArray());
  const s = 11 / size.y;
  root.scale.setScalar(s);
  root.updateMatrixWorld(true);
  const bb2 = new THREE.Box3().setFromObject(root);
  root.position.y -= bb2.min.y;
  scene.add(root);
  window.__ready = true;
});
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script></body></html>
